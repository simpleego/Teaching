<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커피 자판기</title>
    <style>
        @font-face {
            font-family: NanumPenScript-Regular;
            src: url(NanumPenScript-Regular.ttf);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        #menu {
            width: 90%;
            margin: 20px auto;
            font-family: NanumPenScript-Regular, 맑은고딕;
            font-weight: 900;
            font-style: normal;
            color: #4d1313;
            text-align: center;
        }

        #menu article button {
            cursor: pointer;
        }

        .coffee article {
            background-color: bisque;
            padding: 10px;
            border-color: rgb(235, 148, 42);
            border-radius: 10px;
            text-align: center;
        }

        #wrapper {
            width: 650px;
            margin: 0 auto;
            padding: 10px;
            border: 10px solid #ccc;
            text-align: center;
        }

        article {
            display: inline-block;
            border: 1px solid #411010;
            padding: 5px;
            margin-right: 30px;
        }

        #led {
            width: 90%;
            margin: 5px auto;
            padding: 10px;
            text-align: center;
            background-color: bisque;
            border: 3px solid rgb(250, 174, 82);
        }

        #led input {
            text-align: right;
            padding: 5px;
            border-color: #ccc;
        }

        #output {
            width: 90%;
            height: 380px;
            padding: 10px;
            position: relative;
            text-align: right;
            display: inline-block;
            border: 10px solid rgb(238, 159, 33);
            background-color: antiquewhite;
            border-radius: 20px;
            margin: 10px auto;
            text-align: center;
        }

        #outCoffees {
            position: absolute;
            width: 200px;
            height: 300px;
            border: 1px solid #ccc;
            padding: 20px;
            display: inline-block;
            top: 2em;
            left: 2em;
            background-image: url('img/coffeeOut.png');
            background-repeat: no-repeat;
        }

        #outCoffee {
            margin-top: 100px;
            margin-left: 10px;
        }

        #led>label:nth-child(4) {
            margin-left: 3em;
        }

        #coinBox {
            width: 90%;
            height: 135px;
            padding: 10px;
            border-radius: 10px;
            margin: 10px auto;
            border: 3px solid #f90;
            vertical-align: baseline;
        }

        #coins {
            display: inline-block;
            float: left;
            text-align: left;
            margin-top: 30px;
        }

        #inCoins {
            float: right;
            display: inline-block;
            width: 150px;
            padding: 1em 2em;
            border: 1px solid #999;
            background-color: #ddd;
            margin: 10px auto;
            border-radius: 10px;
        }

        #coins img {
            cursor: grab;
        }

        #slot {
            width: 100px;
            padding: 10px;
            background-color: #ddd;
            border: 10px solid #555;
            border-radius: 10px;
        }

        #outCoins {
            display: inline-block;
            position: absolute;
            margin-left: 2em;
            right: 2em;
            top: 2em;
        }

        #outCoins button {
            width: 70px;
            height: 70px;
            background-image: url('img/return.png');
            background-repeat: no-repeat;
            border-radius: 50%;
            border: 3px solid #f90;
            margin-bottom: 10px;
            cursor: pointer;
        }

        #inCoins input {
            width: 100px;
            padding: 5px 5px;
            border: 5px solid #999;
            background-color: #333;
            border-radius: 20px;
        }

        .fade-out {
            opacity: 0;
            transition: opacity 1s ease-out;
        }
    </style>
</head>

<body>
    <div id="wrapper">
        <h1>커피 자판기</h1>
        <div id="menu">
            <div class="coffee">
                <article>
                    <img src="img/milkOut.png" alt="밀크커피">
                    <h3>가격 : <span id="milkPrice"></span>원</h3>
                    <button class="coffeeBtn" id="milk">밀크커피</button>
                </article>
                <article>
                    <img src="img/sugarOut.png" alt="설탕커피">
                    <h3>가격 : <span id="sugarPrice"></span>원</h3>
                    <button class="coffeeBtn" id="sugar">설탕커피</button>
                </article>
                <article>
                    <img src="img/blackOut.png" alt="블랙커피">
                    <h3>가격 : <span id="blackPrice"></span>원</h3>
                    <button class="coffeeBtn" id="black">블랙커피</button>
                </article>
            </div>
        </div>
        <div id="led">
            <label for="coin">동전 : </label>
            <input type="text" size="3" value="0" id="coin" placeholder="동전 입력">원
            <button id="inputMoney">동전입력</button>

            <label for="inMoney">
                투입금액 :
                <input type="text" readonly size="4" id="inMoney" value="0">원
            </label>

        </div>
        <div id="coinBox">
            <div id="coins">
                <img class="coin" draggable="true" src="img/coin500.png" id="coin500" alt="500원">
                <img class="coin" draggable="true" src="img/coin100.png" id="coin100" alt="100원">
                <img class="coin" draggable="true" src="img/coin50.png" id="coin50" alt="50원">
            </div>
            <div id="inCoins">
                <div id="slot"></div>
            </div>
        </div>

        <div id="output">
            <div id="outCoffees">
                <div id="outCoffee" style="visibility: hidden;">
                    <img class="imgCoffee" src="img/milkOut.png">
                </div>
            </div>
            <div id="outCoins">
                <p><button id="exchangCoins"></button></p>
                <textarea rows="15" cols="30" id="exchangeCoins"></textarea>
            </div>
        </div>
    </div>
</body>
<script>
    document.addEventListener("DOMContentLoaded", () => {

        // 메뉴선택 처리

        // 총입력한 동전
        let totInMoney = 0;

        // 자판기 판매금액 누적
        let VMInMoney = 0;
        const MILK_PRICE = 300;
        const SUGAR_PRICE = 200;
        const BLACK_PRICE = 100;

        const coffeeNames = ['밀크', '설탕', '블랙'];

        // 화면에 가격 표시 
        document.querySelector("#milkPrice").innerText = MILK_PRICE;
        document.querySelector("#sugarPrice").innerText = SUGAR_PRICE;
        document.querySelector("#blackPrice").innerText = BLACK_PRICE;

        // 커피 출력화면 연결
        const $outCoffeeImg = document.querySelector('#outCoffee img');
        console.log('$outCoffeeImg :' + $outCoffeeImg.src)

        // 동전 드롭영역 연결
        const slot = document.querySelector("#slot");
        const coin500 = document.querySelector("#coin500");

        // 동전 드래그 시작
        coin500.addEventListener("dragstart",function(event){
            event.dataTransfer.setData("text",event.target.id);
            console.log('-->'+event.target.id);
        });

        // 동전 드래그 진행 중...
        slot.addEventListener("dragover",(event)=>{
            event.preventDefault();// 각각의 고유 이벤트 방지
        });

        // 동전 드롭 : 동전값 만큼 누적, 동전이 사라짐
        slot.addEventListener("drop",(event)=>{
            const coinId = event.dataTransfer.getData("text");
            console.log('==>'+coinId);
            const draggedCoin = document.getElementById(coinId);

            let coinValue = draggedCoin.getAttribute('alt');
            totInMoney += parseInt(
                coinValue.slice(0,
                coinValue.lastIndexOf("원",coinValue)));
            document.querySelector("#inMoney").value = totInMoney;

            // 동전 복사
            const newCoin = draggedCoin.cloneNode(true);
            newCoin.style.position = "static";
            newCoin.style.zIndex = "1";
            slot.appendChild(newCoin);

            setTimeout(()=>{
                newCoin.remove();
            }, 1000);
        })




        // 커피 메뉴를 선택하면 각각 메뉴에 맞는 기능 구현
        const coffeeBtns = document.querySelectorAll('.coffeeBtn')
            .forEach(coffeeBtn => {
                coffeeBtn.addEventListener('click', function (event) {

                    // 커피메뉴 클릭하면 해야할 일을 기술
                    // 1. 커피메뉴 이름 가져오기
                    let coffeeName = event.target.textContent;
                    coffeeName = coffeeName.slice(0, 2);
                    let coffeePrice = getPrice(coffeeName);

                    // 투입한 동전과 커피가격을 비교하여 커피 판매
                    if (totInMoney >= coffeePrice) {
                        VMInMoney += coffeePrice;
                        totInMoney -= coffeePrice;
                        document.querySelector("#inMoney").value = totInMoney;


                        // 선택한 커피 메뉴 출력
                        imgSrc = outCoffee(coffeeName);
                        $outCoffeeImg.src = imgSrc;
                        $outCoffeeImg.style.visibility = 'visible';
                    }
                });
            });

        function outCoffee(coffeeName) {
            let imgName = '';

            switch (coffeeName) {
                case '밀크':
                    imgName = 'milkOut';
                    break;
                case '설탕':
                    imgName = 'sugarOut';
                    break;
                case '블랙':
                    imgName = 'blackOut';
                    break;
            }
            return 'img/' + imgName + '.png';
        }

        function getPrice(coffeeName) {

            let coffeePrice;

            switch (coffeeName) {
                case '밀크':
                    coffeePrice = MILK_PRICE;
                    break;
                case '설탕':
                    coffeePrice = SUGAR_PRICE;
                    break;
                case '블랙':
                    coffeePrice = BLACK_PRICE;
                    break;
            }
            return coffeePrice;
        }      

        // 동전입력 처리
        document.querySelector('#inputMoney').
            addEventListener('click', function(){

            // 동전 입력 처리
            let coin = document.querySelector("#coin").value;

            // 동전 누적
            totInMoney += parseInt(coin);

            // 동전 누적 출력
            document.querySelector("#inMoney").value = totInMoney;  

        });                     
        

        function exchangeCoins() {

            let coins = document.querySelector("#inMoney").value;
            document.querySelector("#inMoney").value = 0;

            document.querySelector("#exchangeCoins").innerHTML = `${coins}`;
            totInMoney = 0;
        }
    });

</script>

</html>
